<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-6xl mx-auto">
    
    <header class="mb-8 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Manager Dashboard</h1>
        <p class="text-gray-500 mt-1">Live Employee Attendance Tracking</p>
      </div>
      <button (click)="fetchLogs()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
        Refresh Data
      </button>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Clock In Time</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let log of logs" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
              #{{ log.employee?.employeeId || log.employeeId || 'N/A' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              {{ log.clockIn | date:'medium' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                {{ log.status }}
              </span>
            </td>
          </tr>
          
          <!-- Empty State -->
          <tr *ngIf="logs.length === 0">
            <td colspan="3" class="px-6 py-8 text-center text-gray-500">
              No attendance records found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
